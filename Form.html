<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uso de Formularios</title>
</head>

<body>

    <h2>Formulario Básico</h2>

    <form action="#" method="post">

        <label for="usuario">Usuario:</label>
        <input type="text" id="usuario" name="usuario" placeholder="Escribe tu usuario" required>
        <br><br>

        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" placeholder="Escribe tu contraseña">
        <br><br>

        <input type="submit" value="Iniciar Sesión">

    </form>

    <h2>Formulario Intermedio</h2>

    <h2>Registro de Nuevo Usuario</h2>

    <form action="#" method="post">

        <fieldset>
            <legend><b>Datos Personales</b></legend>

            <label for="nombre">Nombre completo:</label>
            <br>
            <input type="text" id="nombre" name="nombre" placeholder="Ej: Ana Perez Mendez" required>
            <br><br>

            <label for="email">Correo electrónico:</label>
            <br>
            <input type="email" id="email" name="email" placeholder="ejemplo@gmail.com" required>
            <br><br>
            <label><form action="fecha">fecha de nacimiento.    </form>></form></label>

        </fieldset>

    </form>

</body>

</html>
